<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logosoartsbranca.png" />
  <title>SOARTS | AUDIOVISUAL</title>
  <meta name="description"
    content="Create stunning landing pages effortlessly with this intuitive web application, designed for marketers and businesses to boost conversions and engagement." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Preconnect abre a conexão (DNS+TLS) com o Google Fonts em paralelo ao
       parse do HTML, em vez de só começar quando o CSS pedir. O <link
       rel="stylesheet"> troca o antigo @import (bloqueante: baixa o CSS,
       parseia, só então descobre as fontes) por descoberta direta no HTML. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;800&display=swap" />

  <!-- A imagem base do Hero é o LCP da página, mas só é descoberta depois do
       JS montar o SVG — preload adianta o fetch pro paralelo com o download
       do bundle. -->
  <link rel="preload" as="image" href="/images/hero/chicao-base.webp" fetchpriority="high" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>

</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
