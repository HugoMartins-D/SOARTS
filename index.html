<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logosoartsbranca.png" />
  <link rel="canonical" href="https://www.soartsfilms.com.br/" />
  <title>SOARTS | AUDIOVISUAL</title>
  <meta name="description"
    content="Vídeos que posicionam marcas. Produção audiovisual especializada em vídeos e fotos institucionais, comerciais e de eventos." />

  <!-- Open Graph / WhatsApp, Facebook, LinkedIn etc. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SOARTS Films" />
  <meta property="og:url" content="https://www.soartsfilms.com.br/" />
  <meta property="og:title" content="SOARTS | AUDIOVISUAL" />
  <meta property="og:description"
    content="Vídeos que posicionam marcas. Produção audiovisual especializada em vídeos e fotos institucionais, comerciais e de eventos." />
  <meta property="og:image" content="https://www.soartsfilms.com.br/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SOARTS | AUDIOVISUAL" />
  <meta name="twitter:description"
    content="Vídeos que posicionam marcas. Produção audiovisual especializada em vídeos e fotos institucionais, comerciais e de eventos." />
  <meta name="twitter:image" content="https://www.soartsfilms.com.br/og-image.jpg" />

  <!-- Preconnect abre a conexão (DNS+TLS) com o Google Fonts em paralelo ao
       parse do HTML, em vez de só começar quando o CSS pedir. O <link
       rel="stylesheet"> troca o antigo @import (bloqueante: baixa o CSS,
       parseia, só então descobre as fontes) por descoberta direta no HTML. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;800&display=swap" />

  <!-- A imagem base do Hero é o LCP da página, mas só é descoberta depois do
       JS montar o SVG — preload adianta o fetch pro paralelo com o download
       do bundle. -->
  <link rel="preload" as="image" href="/images/hero/chicao-base.webp" fetchpriority="high" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>

</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
